name: Windows planning baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure-and-build:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure planning baseline
        shell: powershell
        run: cmake --fresh --preset windows-vs2022

      - name: Build Debug
        shell: powershell
        run: cmake --build --preset windows-debug --parallel

      - name: Build Release
        shell: powershell
        run: cmake --build --preset windows-release --parallel
